name: Deploy to Cloud Run

on:
  push:
    branches: [master]

env:
  PROJECT_ID: scrimterz-bangkok-urban
  REGION: asia-southeast1
  SERVICE_NAME: bangkok-dashboard

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Step 1: Pull the latest code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Authenticate to Google Cloud using the secret key
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 3: Set up the gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Step 4: Build and deploy directly to Cloud Run (source-based deploy)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --source . \
            --region $REGION \
            --allow-unauthenticated \
            --memory 1024Mi \
            --project $PROJECT_ID
